! Lab 01 — VLAN + trunk
! Device: Cisco 2960 (Packet Tracer)
! Role: SW1, left switch
!
hostname SW1
!
no ip domain-lookup
!
vlan 10
 name Staff
vlan 20
 name Guests
!
interface FastEthernet0/1
 description Access — PC1 Staff
 switchport mode access
 switchport access vlan 10
 switchport nonegotiate
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/2
 description Access — PC2 Guest
 switchport mode access
 switchport access vlan 20
 switchport nonegotiate
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet0/1
 description Trunk to SW2 Gi0/1
 switchport mode trunk
 switchport nonegotiate
 switchport trunk allowed vlan 10,20
 no shutdown
!
! On a 3560, add this BEFORE "switchport mode trunk":
!  switchport trunk encapsulation dot1q
! On a 2960 in Packet Tracer that command is not available and will be rejected.
!
end
