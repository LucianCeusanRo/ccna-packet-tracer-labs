! Lab 02 — Inter-VLAN routing (router-on-a-stick)
! Device: Cisco 2911 (Packet Tracer)
! Role: R1
!
hostname R1
!
no ip domain-lookup
!
interface GigabitEthernet0/0
 description Trunk from SW1 Gi0/1 — no IP on the physical interface
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.10
 description Staff gateway
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
!
interface GigabitEthernet0/0.20
 description Guest gateway
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
!
! Inter-VLAN routing is already enabled: the router has connected routes
! for both subnets and will forward between them.
!
end
