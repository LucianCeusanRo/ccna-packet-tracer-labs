! Lab 04 — Variant A: standard ACL
! Apply this AFTER the base R1.cfg (or merge into it).
! Do not also apply the extended ACL at the same time.
!
! Goal: block the entire Guest network (192.168.20.0/24) from reaching
! the Staff network. Place a standard ACL close to the destination:
! outbound on the Staff subinterface.
!
access-list 10 deny 192.168.20.0 0.0.0.255
access-list 10 permit any
!
interface GigabitEthernet0/0.10
 ip access-group 10 out
!
! Remember: a standard ACL has an implicit "deny any" at the end.
! Without "permit any", you would also drop Staff return traffic and
! anything else leaving G0/0.10.
!
end
