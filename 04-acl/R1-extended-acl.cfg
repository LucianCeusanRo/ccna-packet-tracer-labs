! Lab 04 — Variant B: extended ACL
! Apply this AFTER the base R1.cfg. If you tested Variant A first,
! remove it with:  no access-list 10
!                  interface g0/0.10
!                   no ip access-group 10 out
!
! Goal: from the Guest network, allow only HTTP to the Staff web server
! 192.168.10.10. Deny any other Guest-to-Staff traffic. Allow everything
! else (for example Guest to other destinations).
! Place an extended ACL close to the source: inbound on G0/0.20.
!
ip access-list extended GUEST_TO_STAFF
 permit tcp 192.168.20.0 0.0.0.255 host 192.168.10.10 eq 80
 deny ip 192.168.20.0 0.0.0.255 192.168.10.0 0.0.0.255
 permit ip any any
!
interface GigabitEthernet0/0.20
 ip access-group GUEST_TO_STAFF in
!
! Implicit deny still exists, but "permit ip any any" is last on purpose.
! Check hit counts with:  show access-lists GUEST_TO_STAFF
!
end
